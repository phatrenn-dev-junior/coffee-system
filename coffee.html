<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Details</title>
  <link rel="stylesheet" href="coffee-style.css">
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">&larr; Back to Home</a>
    
    <div class="coffee-detail-card">
      <div class="coffee-image">
        <img src="./image/item-cafe.png" alt="Coffee Detail">
      </div>
      
      <div class="coffee-info">
        <h1>Espresso Coffee</h1>
        <p class="price">$3.50</p>
        <p class="description">
          A rich and concentrated form of coffee served in small, strong shots. Crafted with premium roasted beans for an authentic aroma and smooth taste to boost your day.
        </p>
        
        <div class="action-buttons">
          <button class="btn-buy">Buy Now</button>
          <button class="btn-cart">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
